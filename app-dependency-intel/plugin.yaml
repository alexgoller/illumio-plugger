apiVersion: plugger/v1
name: app-dependency-intel
version: 0.1.0
image: plugger-app-dependency-intel:latest

schedule:
  mode: daemon

env:
  - name: LOOKBACK_DAYS
    required: false
    default: "30"
  - name: MAX_FLOWS
    required: false
    default: "200000"
  - name: SCAN_INTERVAL
    required: false
    default: "3600"
  - name: PCE_TLS_SKIP_VERIFY
    required: false
    default: "true"

health:
  endpoint: /healthz
  port: 8080
  interval: 30s
  timeout: 5s
  retries: 3

resources:
  memoryLimit: 512m
  cpuLimit: "1.0"
