name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/alexgoller/plugger-

jobs:
  # Plugin images are built by the "Build Plugin Images" workflow
  # (.github/workflows/plugins.yaml), tagged with each plugin's own version.
  # This workflow builds the plugger CLI release artifacts only.

  # ------------------------------------------------------------------
  # Build the Go CLI binary for multiple OS/arch combinations
  # ------------------------------------------------------------------
  cli:
    name: "CLI: ${{ matrix.goos }}/${{ matrix.goarch }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BINARY="plugger-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY="${BINARY}.exe"; fi
          go build \
            -ldflags "-X github.com/illumio/plugger/internal/cli.Version=${VERSION}" \
            -o "bin/${BINARY}" \
            ./cmd/plugger

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugger-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/plugger-*

  # ------------------------------------------------------------------
  # Create a GitHub Release with CLI binaries (only on tags)
  # ------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli]
    runs-on: ubuntu-latest

    steps:
      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: plugger-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum plugger-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
