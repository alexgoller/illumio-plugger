plugger: v1

ports:
  - port: 8080
    protocol: tcp
    name: dashboard
    description: Nozomi sync dashboard
    type: ui
    path: /

config:
  - name: NOZOMI_MODE
    description: "Deployment model: vantage (cloud) or guardian (on-prem/CMC)"
    required: false
    type: string
    default: "vantage"
  - name: NOZOMI_HOST
    description: "Nozomi base URL (Vantage: https://<tenant>.vantage.nozominetworks.io ; Guardian: https://<guardian-host>)"
    required: true
    type: string
  - name: NOZOMI_KEY_NAME
    description: Vantage API key name (vantage mode)
    required: false
    type: string
  - name: NOZOMI_KEY_TOKEN
    description: Vantage API key token (vantage mode)
    required: false
    type: secret
  - name: NOZOMI_USERNAME
    description: Guardian username (guardian mode)
    required: false
    type: string
  - name: NOZOMI_PASSWORD
    description: Guardian password (guardian mode)
    required: false
    type: secret
  - name: NOZOMI_TLS_SKIP_VERIFY
    description: Skip TLS verification for the Nozomi endpoint
    required: false
    type: bool
    default: "true"
  - name: SYNC_INTERVAL
    description: Seconds between syncs
    required: false
    type: int
    default: "3600"
  - name: CREATE_LABELS
    description: Create missing Illumio label values (and custom dimensions) on demand
    required: false
    type: bool
    default: "true"
  - name: LABEL_MAP
    description: 'JSON overriding the Nozomi->Illumio label map, e.g. {"role":["type"],"env":["level"]}'
    required: false
    type: string
  - name: PAGE_SIZE
    description: Vantage assets page size
    required: false
    type: int
    default: "500"
  - name: DRY_RUN
    description: Compute the sync but do not write to Illumio
    required: false
    type: bool
    default: "false"
  - name: DEBUG
    description: Dump a raw Nozomi asset + computed mapping for field-map tuning
    required: false
    type: bool
    default: "false"
  - name: PCE_TLS_SKIP_VERIFY
    description: Skip TLS verification for the PCE
    required: false
    type: bool
    default: "true"

info:
  title: Nozomi Sync
  version: "0.1.0"
  description: "Sync OT/ICS/IoT asset inventory from Nozomi Networks (Vantage or Guardian) into Illumio as unmanaged workloads with labels (type, zone, Purdue level, vendor, criticality)."
  author: Illumio
  license: Apache-2.0
  homepage: https://github.com/alexgoller/illumio-plugger/tree/main/nozomi-sync
