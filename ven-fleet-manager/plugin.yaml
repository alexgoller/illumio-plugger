apiVersion: plugger/v1
name: ven-fleet-manager
version: 0.1.0
image: plugger-ven-fleet-manager:latest

schedule:
  mode: daemon

env:
  - name: SCAN_INTERVAL
    required: false
    default: "3600"
  - name: OFFLINE_THRESHOLD_HOURS
    required: false
    default: "24"
  - name: STALE_HEARTBEAT_HOURS
    required: false
    default: "48"
  - name: PCE_TLS_SKIP_VERIFY
    required: false
    default: "true"

health:
  endpoint: /healthz
  port: 8080
  interval: 30s
  timeout: 5s
  retries: 3

resources:
  memoryLimit: 256m
  cpuLimit: "0.5"
